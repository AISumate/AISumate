# CD — deploys to Vercel production on every push to main.
# Quality gates run again here so a deploy can never skip them, then the
# Vercel CLI builds with the project's settings and ships the result.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — Vercel account token (vercel.com/account/tokens)
#   VERCEL_ORG_ID      — from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  — from .vercel/project.json after `vercel link`
# Runtime env vars (TEABLE_API_KEY etc.) are configured in the Vercel
# project dashboard, NOT here — see DEPLOYMENT.md for the full list.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deploys must pass the same gates as CI — no shortcut to production.
      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
